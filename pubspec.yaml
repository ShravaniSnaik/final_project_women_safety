name: flutter_application_2
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  http: ^1.4.0
  flutter_markdown: ^0.7.7+1
  cupertino_icons: ^1.0.8
  carousel_slider: ^5.0.0
  flutter_sms: ^2.3.3
  fluttertoast: ^8.2.12
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  firebase_messaging: ^15.2.4
  shared_preferences: ^2.5.2
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.0.0
  webview_flutter_wkwebview: ^3.18.4
  webview_flutter_platform_interface: ^2.10.0
  flutter_phone_direct_caller: ^2.1.1
  url_launcher: ^6.3.1
  permission_handler: ^12.0.0+1
  image_picker: ^1.1.2
  uuid: ^4.5.1
  cached_network_image: ^3.4.1
  flutter_native_splash: ^2.4.5
  lottie: ^3.3.1
  animated_splash_screen: ^1.3.0
  flutter_contacts: ^1.1.6
  google_maps_flutter: ^2.5.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  latlong2: ^0.9.0
  flutter_map: ^8.1.1
  flutter_rating_bar: ^4.0.1
  shake: ^2.2.0
  flutter_background_service: ^5.1.0
  flutter_background_service_android: ^6.3.0
  flutter_background_service_ios: ^5.0.3
  flutter_local_notifications: ^19.0.0
  telephony: ^0.2.0
  vibration: ^3.1.3
  flutter_launcher_icons: ^0.14.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.4  # For mocking Firebase services
  build_runner: ^2.4.6
  firebase_auth_mocks: ^0.14.1


flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/animations/
    - assets/logo.png
    - assets/login_page_background.jpg
    - assets/animations/location.json
    - assets/animations/oportunity.json

  fonts:
  - family: Poppins
    fonts:
      - asset: ./fonts/Poppins/Poppins-Black.ttf
        weight: 900
      - asset: ./fonts/Poppins/Poppins-ExtraBold.ttf
        weight: 800
      - asset: ./fonts/Poppins/Poppins-Bold.ttf
        weight: 700
      - asset: ./fonts/Poppins/Poppins-Medium.ttf
        weight: 500  # Medium weight
      - asset: ./fonts/Poppins/Poppins-Regular.ttf
        weight: 400  # Normal weight
      - asset: ./fonts/Poppins/Poppins-Italic.ttf
        style: italic

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#ffffff"  # Can be a color or image
  adaptive_icon_foreground: "assets/logo.png"  # Foreground icon (should be transparent)
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#ffffff"
    theme_color: "#000000"
  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 128
  macos:
    generate: true
    image_path: "assets/logo.png"
